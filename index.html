// ── ACCESS ───────────────────────────────────────────────────
function checkAccess(){
  const p=new URLSearchParams(window.location.search);
  const school=p.get('school'),key=p.get('key');
  if(!school||!key||SCHOOL_KEYS[school]!==key){document.getElementById('accessDenied').classList.add('show');return;}
  isAdmin=school==='admin'; allowedSchoolId=isAdmin?null:school;
  document.getElementById('app').style.display='block';
}

// ── YANDEX MAP INITIALIZATION ────────────────────────────────
function initYandexMap(){
  ymap = new ymaps.Map("map", {
    center: [42.87, 74.59],
    zoom: 12,
    controls: ['zoomControl']
  });

function setSchoolMarker(lat, lng){
  if(schoolPlacemark) ymap.geoObjects.remove(schoolPlacemark);
  // Используем светлый пресет академической шапки без жесткого переопределения цвета в черный
  schoolPlacemark = new ymaps.Placemark([lat, lng], {
    hintContent: S.school ? S.school.name : 'Школа',
    balloonContent: S.school ? S.school.name : 'Школа'
  }, {
    preset: 'islands#blueEducationIcon' 
  });
  ymap.geoObjects.add(schoolPlacemark);
}

function setHomeMarker(lat, lng){
  if(homePlacemark) ymap.geoObjects.remove(homePlacemark);
  homePlacemark = new ymaps.Placemark([lat, lng], {
    hintContent: 'Дом ребёнка'
  }, {
    preset: 'islands#orangeHomeIcon'
  });
  ymap.geoObjects.add(homePlacemark);
  if(S.schoolLat) drawRoute([lat, lng], [S.schoolLat, S.schoolLng]);
}

function drawRoute(start, end){
  if(currentRoute) ymap.geoObjects.remove(currentRoute);
  
  ymaps.route([start, end], {
    mapStateAutoApply: false,
    routingMode: 'auto'
  }).then(function (route) {
    currentRoute = route;
    currentRoute.getPaths().options.set({
      strokeColor: '#E8621A',
      strokeWidth: 4,
      strokeOpacity: 0.8
    });
    currentRoute.getWayPoints().removeAll();
    ymap.geoObjects.add(currentRoute);
  });
}

function setHome(lat, lng, text){
  S.homeLat = lat;
  S.homeLng = lng;
  S.homeText = text || '';
  setHomeMarker(lat, lng);
  calcDist(lat, lng);
}

// ── NATIVE YANDEX SUGGEST ────────────────────────────────────
let searchTimer, lastQ='';

function onAddrInput(val){
  clearTimeout(searchTimer);
  if(val.length<2){closeSug();return;}
  lastQ=val;
  showLoading();
  searchTimer=setTimeout(()=>doSearch(val),400);
}

function showLoading(){
  const el=document.getElementById('addrSug');
  el.innerHTML=`<div class="sug-loading"><div class="sug-spin"></div>Поиск...</div>`;
  el.classList.add('open');
}

function doSearch(q){
  if(q!==lastQ) return;
  
  // Используем встроенный метод подсказок API Яндекса (работает без CORS-ошибок)
  ymaps.suggest("Бишкек, " + q, { results: 5 }).then(function (items) {
    if(items && items.length > 0){
      renderSug(items);
    } else {
      document.getElementById('addrSug').innerHTML=`<div class="sug-loading">Ничего не найдено</div>`;
    }
  }).catch(function(e) {
    document.getElementById('addrSug').innerHTML=`<div class="sug-loading">Ошибка поиска</div>`;
  });
}

function renderSug(items){
  if(lastQ!==document.getElementById('addrSearch').value) return;
  const el=document.getElementById('addrSug');
  
  el.innerHTML=items.map((item, i)=>{
    // Убираем лишние префиксы страны для красоты в списке
    const display = item.displayName.replace('Кыргызстан, ', '').replace('Бишкек, ', '');
    return `
      <div class="sug-item" onmousedown="selectSug(${i})">
        <svg class="sug-item-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <div>
          <div class="sug-main">${display}</div>
        </div>
      </div>`;
  }).join('');
  el.classList.add('open');
  window._sugItems=items;
}

function selectSug(i){
  const item=window._sugItems[i];
  if(!item) return;
  closeSug();
  
  const cleanText = item.displayName.replace('Кыргызстан, ', '').replace('Бишкек, ', '');
  document.getElementById('addrSearch').value = cleanText;

  // Через родной геокодер превращаем выбранную подсказку в точные координаты lat/lng
  ymaps.geocode(item.value).then(function (res) {
    const firstGeoObject = res.geoObjects.get(0);
    if (firstGeoObject) {
      const coords = firstGeoObject.geometry.getCoordinates();
      const lat = coords[0];
      const lng = coords[1];
      
      if(!isNaN(lat) && !isNaN(lng)){
        fillAddrFieldsFromText(cleanText);
        setHome(lat, lng, cleanText + ', Бишкек');
        ymap.setCenter([lat, lng], 16);
      }
    }
  }).catch(e => console.error("Ошибка получения координат:", e));
}

function fillAddrFieldsFromText(text){
  document.getElementById('addrFields').classList.add('show');
  const parts=text.split(',');
  document.getElementById('addrStreet').value=(parts[0]||'').trim();
  const housePart=(parts[1]||'').trim();
  const houseMatch=housePart.match(/\d+/);
  document.getElementById('addrHouse').value=houseMatch?houseMatch[0]:'';
}

function closeSug(){document.getElementById('addrSug').classList.remove('open');}

    document.getElementById('selectedSchoolLabel').textContent=s.name;

    if(s.branches){
      const bp=document.getElementById('branchPicker');
      bp.innerHTML=s.branches.map(b=>`<button class="branch-btn" onclick="selectBranch('${s.id}','${b.id}')" id="bb_${b.id}">${b.name}</button>`).join('');

      selectBranch(s.id,s.branches[0].id);
    } else {
      S.schoolLat=s.lat;S.schoolLng=s.lng;
      setSchoolMarker(s.lat,s.lng);
      ymap.setCenter([s.lat, s.lng], 14);
      showForm();
    }
  }
}

  document.getElementById('schoolModal').classList.add('show');

function closeSchoolModal(){document.getElementById('schoolModal').classList.remove('show');}

function selectSchool(id){

  S.school=s;S.branch=null;
  closeSchoolModal();
  document.getElementById('selectedSchoolLabel').textContent=s.name;
  document.getElementById('headerBadge').style.display='flex';
  document.getElementById('headerSchoolName').textContent=s.name;

function selectBranch(sid,bid){
  const s=SCHOOLS.find(x=>x.id===sid),b=s.branches.find(x=>x.id===bid);
  S.branch=b;S.schoolLat=b.lat;S.schoolLng=b.lng;
  document.querySelectorAll('.branch-btn').forEach(el=>el.classList.remove('selected'));
  document.getElementById('bb_'+bid)?.classList.add('selected');
  setSchoolMarker(b.lat,b.lng);

  if(S.homeLat){calcDist(S.homeLat,S.homeLng);setHomeMarker(S.homeLat,S.homeLng);}
}

// ── DISTANCE ─────────────────────────────────────────────────
function haversine(a,b,c,d){const R=6371,dL=(c-a)*Math.PI/180,dN=(d-b)*Math.PI/180;const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function calcDist(lat,lng){
  if(!S.schoolLat)return;
  const dist=haversine(lat,lng,S.schoolLat,S.schoolLng),eff=dist-0.3;
  S.distKm=dist;
  const s=S.school;
  let zone,price;
  if(s.p3===0){zone=eff<=3?1:2;price=eff<=3?s.p1:s.p2;}
  else{zone=eff<=3?1:eff<=6?2:3;price=eff<=3?s.p1:eff<=6?s.p2:s.p3;}
  S.zone=zone;S.zonePrice=price;
  document.getElementById('distBadge').classList.add('show');
  document.getElementById('distVal').textContent=dist.toFixed(2);
  document.getElementById('zoneTag').textContent='Зона '+zone;
  renderTs();updatePrice();
}

function addChild(){S.children.push({name:'',grade:''});renderChildren();updatePrice();}
function rmChild(i){S.children.splice(i,1);renderChildren();updatePrice();}

function updatePrice(){
  const base=getTsPrice();
  const ps=document.getElementById('priceSummary');
  if(!base||!S.children.length){ps.style.display='none';return;}
  ps.style.display='block';
  let total=0;
  document.getElementById('priceRows').innerHTML=S.children.map((c,i)=>{
    const p=Math.round(base*(i>0?.95:1));total+=p;
    return `<div class="price-row"><span>${c.name||'Ребёнок '+(i+1)}${i>0?' (−5%)':''}</span><span class="val">${p.toLocaleString()} сом</span></div>`;
  }).join('');
  document.getElementById('priceTotal').textContent=total.toLocaleString();
}

function showSection(sec){
  document.querySelectorAll('.sidebar-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));

// ── SUBMIT ───────────────────────────────────────────────────
function getFullAddr(){
  const street=document.getElementById('addrStreet').value.trim();
  const house=document.getElementById('addrHouse').value.trim();
  const flat=document.getElementById('addrFlat').value.trim();
  const note=document.getElementById('addrNote').value.trim();
  let addr=street;
  if(house) addr+=', д.'+house;
  if(flat) addr+=', кв.'+flat;
  if(note) addr+=' ('+note+')';
  return addr||S.homeText||document.getElementById('addrSearch').value;
}

async function submitForm(){
  if(!S.school){toast('Выберите школу','error');return;}
  if(!S.homeLat){toast('Укажите адрес','error');return;}
  if(!document.getElementById('addrStreet').value.trim()){toast('Укажите улицу или микрорайон','error');return;}
  if(!document.getElementById('addrHouse').value.trim()){toast('Укажите номер дома','error');return;}
  if(!S.children.every(c=>c.name.trim()&&c.grade.trim())){toast('Заполните данные всех детей','error');return;}
  if(!v('parentName')){toast('Укажите ФИО родителя','error');return;}
  if(!v('parentRelation')){toast('Укажите родство','error');return;}
  if(!v('parentPhone1')){toast('Укажите телефон','error');return;}
  if(!v('parentTelegram')){toast('Укажите Telegram','error');return;}

  const base=getTsPrice(), schoolName=S.branch?S.branch.name:S.school.name;
  const tsMap={bus:'Микроавтобус',van:'Минивэн',sedan:'Седан'};
  const familyCode='FAM-'+Date.now().toString(36).toUpperCase();
  const timestamp=new Date().toLocaleString('ru-RU');
  const fullAddr=getFullAddr();

  document.getElementById('loadingOverlay').classList.add('show');
  try{
    const promises=S.children.map((child,i)=>{
      const price=Math.round(base*(i>0?.95:1));
      const payload={
        timestamp,familyCode,school:schoolName,branch:S.branch?S.branch.name:'',
        address:fullAddr,
        lat:S.homeLat,lng:S.homeLng,              // Точные координаты дома
        schoolLat:S.schoolLat,schoolLng:S.schoolLng,
        distanceKm:S.distKm?S.distKm.toFixed(2):'',zone:S.zone||'',
        transport:tsMap[S.tsType],zonePrice:base,
        childName:child.name,childGrade:child.grade,
        childNum:i+1,childPrice:price,discount:i>0?'5%':'',
        totalChildren:S.children.length,
        parentName:v('parentName'),parentRelation:v('parentRelation'),
        parentPhone1:v('parentPhone1'),parentPhone2:v('parentPhone2'),parentTelegram:v('parentTelegram'),
        extraName:v('extraName'),extraRelation:v('extraRelation'),
        extraPhone1:v('extraPhone1'),extraPhone2:v('extraPhone2'),
        comment:v('comment'),manager:S.school.manager,
      };
      return fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    });
    await Promise.all(promises);
    let total=0;S.children.forEach((_,i)=>total+=Math.round(base*(i>0?.95:1)));
    showSuccess(schoolName,total,familyCode,fullAddr);
  }catch(e){toast('Ошибка. Попробуйте ещё раз.','error');}
  finally{document.getElementById('loadingOverlay').classList.remove('show');}
}

function v(id){return(document.getElementById(id)||{}).value?.trim()||'';}

function showSuccess(schoolName,total,familyCode,addr){
  document.getElementById('formWrap').style.display='none';
  document.getElementById('successCard').innerHTML=`
    <div class="s-row"><span class="k">Код семьи</span><span class="v" style="font-family:monospace">${familyCode}</span></div>
    <div class="s-row"><span class="k">Школа</span><span class="v">${schoolName}</span></div>
    <div class="s-row"><span class="k">Адрес</span><span class="v">${addr.split(',').slice(0,2).join(',')}</span></div>
    <div class="s-row"><span class="k">Зона</span><span class="v">Зона ${S.zone||'—'} · ${S.distKm?S.distKm.toFixed(2)+' км':'—'}</span></div>
    <div class="s-row"><span class="k">Детей</span><span class="v">${S.children.length}</span></div>
    <div class="s-row"><span class="k">Итого / мес</span><span class="v" style="font-size:16px;font-weight:700">${total.toLocaleString()} сом</span></div>`;
  const ph='+'+S.school.manager;
  document.getElementById('mgrPhone').textContent=ph;
  document.getElementById('mgrCallLink').href='tel:'+ph;
  document.getElementById('successScreen').classList.add('show');
}

function renderFaq(){
  document.getElementById('faqCategories').innerHTML=FAQ.map((cat,ci)=>`
    <div class="faq-cat">
      <button class="faq-cat-btn" onclick="toggleFaqCat(${ci})" id="fcb${ci}">
        <span>${cat.cat}</span><span id="fci${ci}" style="font-size:11px;color:var(--text-muted)">▾</span>
      </button>
      <div class="faq-questions" id="fq${ci}">
        ${cat.items.map((item,qi)=>`
          <button class="faq-q-btn" onclick="toggleFaqQ(${ci},${qi})"><span>${item.q}</span><span style="flex-shrink:0;font-size:10px">▾</span></button>
          <div class="faq-answer" id="fa${ci}_${qi}">${item.a}</div>
        `).join('')}
      </div>
    </div>`).join('');
}
function toggleFaqCat(ci){const o=document.getElementById('fq'+ci).classList.toggle('open');document.getElementById('fcb'+ci).classList.toggle('open',o);document.getElementById('fci'+ci).textContent=o?'▴':'▾';}
function toggleFaqQ(ci,qi){document.getElementById(`fa${ci}_${qi}`).classList.toggle('open');}
function toast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.className='toast',3200);}
